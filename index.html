<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FluxTrack — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --navy:#030d1f;
  --navy-mid:#060f28;
  --navy-surface:#091530;
  --accent:#1a6bff;
  --accent-light:#4db8ff;
  --accent-glow:rgba(26,107,255,0.35);
  --teal:#00c6a2;
  --border-subtle:rgba(100,150,255,0.12);
  --border-mid:rgba(100,150,255,0.2);
  --text-primary:#ffffff;
  --text-secondary:rgba(255,255,255,0.55);
  --text-muted:rgba(255,255,255,0.3);
  --input-bg:rgba(8,20,60,0.7);
  --radius:14px;
  --radius-sm:10px;
  --transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
}

html,body{height:100%;width:100%;overflow:hidden}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--navy);
  color:var(--text-primary);
  display:flex;
  align-items:stretch;
  min-height:100vh;
}

/* ─── CANVAS LEFT ─── */
.left-panel{
  flex:1;
  position:relative;
  overflow:hidden;
  background:var(--navy);
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
}

/* Geometric background */
.geo-bg{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.geo-bg::before{
  content:'';
  position:absolute;
  width:700px;height:700px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(26,107,255,0.18) 0%,transparent 70%);
  top:-200px;left:-100px;
  animation:breathe 8s ease-in-out infinite;
}
.geo-bg::after{
  content:'';
  position:absolute;
  width:500px;height:500px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(0,198,162,0.12) 0%,transparent 70%);
  bottom:-150px;right:-80px;
  animation:breathe 10s ease-in-out infinite reverse;
}

@keyframes breathe{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.08);}
}

/* Grid lines */
.grid-overlay{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(100,150,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(100,150,255,0.05) 1px, transparent 1px);
  background-size:60px 60px;
}

/* Floating orbs */
.orb{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}
.orb-1{
  width:160px;height:160px;
  background:radial-gradient(circle,rgba(26,107,255,0.25),transparent 70%);
  top:20%;left:15%;
  animation:float1 7s ease-in-out infinite;
}
.orb-2{
  width:100px;height:100px;
  background:radial-gradient(circle,rgba(0,198,162,0.2),transparent 70%);
  top:55%;left:60%;
  animation:float2 9s ease-in-out infinite;
}
.orb-3{
  width:80px;height:80px;
  background:radial-gradient(circle,rgba(77,184,255,0.18),transparent 70%);
  top:75%;left:25%;
  animation:float1 11s ease-in-out infinite reverse;
}

@keyframes float1{0%,100%{transform:translateY(0) translateX(0);}33%{transform:translateY(-18px) translateX(8px);}66%{transform:translateY(10px) translateX(-6px);}}
@keyframes float2{0%,100%{transform:translateY(0);}50%{transform:translateY(-24px);}}

/* Left panel content */
.left-content{
  position:absolute;
  inset:0;
  z-index:2;
  overflow:hidden;
  animation:fadeSlideUp 0.8s ease both;
}

@keyframes fadeSlideUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeSlideRight{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:translateX(0);}}

.brand-mark{
  display:inline-flex;
  align-items:center;
  gap:14px;
  margin-bottom:52px;
}

.brand-icon{
  width:52px;height:52px;
  border-radius:16px;
  background:linear-gradient(135deg,#1250cc,#1a6bff);
  border:1.5px solid rgba(100,160,255,0.35);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 6px rgba(26,107,255,0.1),0 12px 36px rgba(26,107,255,0.4);
}
.brand-icon svg{width:26px;height:26px;}

.brand-text-wrap{}
.brand-name{
  font-size:20px;font-weight:800;letter-spacing:-0.3px;
  color:#fff;
}
.brand-name span{color:var(--accent-light);}
.brand-tagline{
  font-size:12px;color:var(--text-muted);margin-top:2px;font-weight:400;letter-spacing:0.2px;
}

.left-headline{
  font-size:38px;font-weight:800;
  line-height:1.18;
  letter-spacing:-1px;
  margin-bottom:18px;
  color:#fff;
}
.left-headline span{
  background:linear-gradient(135deg,#1a8fff,#00c6a2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.left-desc{
  font-size:15px;line-height:1.7;
  color:var(--text-secondary);
  margin-bottom:40px;
  max-width:380px;
}

.features-list{
  display:flex;flex-direction:column;gap:14px;
}

.feature-item{
  display:flex;align-items:center;gap:14px;
}
.feature-icon{
  width:36px;height:36px;border-radius:10px;
  background:rgba(26,107,255,0.1);
  border:1px solid rgba(26,107,255,0.2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.feature-icon svg{width:16px;height:16px;color:#4db8ff;}
.feature-text{
  font-size:13px;font-weight:500;
  color:rgba(255,255,255,0.65);
}

/* Stats row */
.stats-row{
  display:flex;gap:28px;
  margin-top:52px;
  padding-top:32px;
  border-top:1px solid var(--border-subtle);
}
.stat-item{}
.stat-num{
  font-size:22px;font-weight:800;letter-spacing:-0.5px;
  font-family:'Sora',sans-serif;
  background:linear-gradient(135deg,#fff,#a0c4ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.stat-label{
  font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:500;letter-spacing:0.3px;
}

/* Divider */
.panel-divider{
  width:1px;
  background:linear-gradient(to bottom,transparent,var(--border-mid) 20%,var(--border-mid) 80%,transparent);
  flex-shrink:0;
}

/* ─── RIGHT PANEL ─── */
.right-panel{
  width:440px;flex-shrink:0;
  background:var(--navy-mid);
  display:flex;align-items:center;justify-content:center;
  padding:52px 44px;
  position:relative;
  overflow:hidden;
  animation:fadeSlideRight 0.7s 0.1s ease both;
}

.right-panel::before{
  content:'';
  position:absolute;
  width:400px;height:400px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(26,107,255,0.08),transparent 70%);
  bottom:-150px;right:-120px;
  pointer-events:none;
}

.login-box{width:100%;position:relative;z-index:1;}

/* Header */
.login-header{
  text-align:center;
  margin-bottom:32px;
}

.logo-circle{
  width:76px;height:76px;border-radius:50%;
  background:linear-gradient(135deg,#1250cc,#1a6bff);
  border:2px solid rgba(100,160,255,0.35);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
  box-shadow:0 0 0 8px rgba(26,107,255,0.1),0 16px 52px rgba(26,107,255,0.45);
  position:relative;
}
.logo-circle::after{
  content:'';
  position:absolute;
  inset:-6px;border-radius:50%;
  border:1px solid rgba(26,107,255,0.2);
  animation:spin-ring 12s linear infinite;
}
@keyframes spin-ring{to{transform:rotate(360deg);}}

.logo-circle svg{width:38px;height:38px;}

.welcome-title{
  font-size:25px;font-weight:800;
  letter-spacing:-0.4px;
  margin-bottom:6px;
}
.welcome-title span{color:var(--accent-light);}
.welcome-sub{
  font-size:13px;color:var(--text-secondary);font-weight:400;
}

/* Error box */
.err-box{
  background:rgba(230,59,59,0.1);
  border:1px solid rgba(230,59,59,0.28);
  border-radius:10px;
  padding:10px 14px;
  color:#ff7070;
  font-size:13px;
  margin-bottom:16px;
  display:none;
  align-items:center;
  gap:8px;
}
.err-box.show{display:flex;}
.err-box svg{width:16px;height:16px;flex-shrink:0;color:#ff5555;}

/* Fields */
.field-group{margin-bottom:16px;}
.field-label{
  display:block;
  font-size:12px;font-weight:700;
  color:rgba(255,255,255,0.7);
  letter-spacing:0.5px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.input-wrap{position:relative;display:flex;align-items:center;}

.input-icon{
  position:absolute;left:15px;
  color:rgba(255,255,255,0.3);
  pointer-events:none;
  transition:var(--transition);
  display:flex;
}
.input-icon svg{width:17px;height:17px;}

.input-wrap input{
  width:100%;height:52px;
  background:var(--input-bg);
  border:1.5px solid var(--border-mid);
  border-radius:var(--radius-sm);
  padding:0 46px 0 46px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14px;font-weight:500;
  color:#fff;
  outline:none;
  transition:var(--transition);
}
.input-wrap input::placeholder{color:rgba(255,255,255,0.2);}
.input-wrap input:focus{
  border-color:var(--accent);
  background:rgba(26,70,190,0.18);
  box-shadow:0 0 0 3px rgba(26,107,255,0.18);
}
.input-wrap:focus-within .input-icon{color:rgba(100,180,255,0.7);}

.eye-btn{
  position:absolute;right:14px;
  background:none;border:none;cursor:pointer;
  color:rgba(255,255,255,0.3);
  padding:4px;
  display:flex;
  transition:color 0.2s;
}
.eye-btn:hover{color:rgba(255,255,255,0.7);}
.eye-btn svg{width:17px;height:17px;display:block;}

/* Options row */
.opts-row{
  display:flex;align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
  gap:8px;
}
.remember-wrap{
  display:flex;align-items:center;gap:8px;cursor:pointer;
}
.remember-wrap input[type=checkbox]{
  width:16px;height:16px;
  accent-color:var(--accent);
  cursor:pointer;
}
.remember-wrap span{
  font-size:12px;color:var(--text-secondary);font-weight:500;
}

.forgot-link{
  font-size:12px;font-weight:700;
  color:#1a8fff;
  text-decoration:none;
  white-space:nowrap;
  transition:color 0.2s;
}
.forgot-link:hover{color:#5ab0ff;}

/* Login button */
.login-btn{
  width:100%;height:56px;
  background:linear-gradient(90deg,#1a5fff 0%,#0080ff 100%);
  color:#fff;border:none;
  border-radius:var(--radius);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:15px;font-weight:700;
  cursor:pointer;
  letter-spacing:0.3px;
  display:flex;align-items:center;justify-content:center;
  gap:0;
  transition:all 0.22s;
  box-shadow:0 6px 30px rgba(26,100,255,0.5);
  position:relative;overflow:hidden;
}
.login-btn::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(rgba(255,255,255,0.09),transparent);
  border-radius:inherit;
}
.login-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 40px rgba(26,100,255,0.65);
}
.login-btn:active{transform:translateY(1px);}

.btn-text{flex:1;text-align:center;position:relative;}
.btn-arrow{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.18);
  display:flex;align-items:center;justify-content:center;
  margin-right:4px;flex-shrink:0;
  position:relative;
  transition:background 0.2s;
}
.login-btn:hover .btn-arrow{background:rgba(255,255,255,0.28);}
.btn-arrow svg{width:16px;height:16px;}

/* Spinner */
.spinner{
  width:20px;height:20px;
  border:2.5px solid rgba(255,255,255,0.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  display:none;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading .spinner{display:block;}
.loading .btn-text,.loading .btn-arrow{display:none;}

/* Divider */
.divider{
  display:flex;align-items:center;gap:12px;
  margin:20px 0;
  color:rgba(255,255,255,0.22);
  font-size:12px;font-weight:500;
}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;
  background:rgba(255,255,255,0.08);
}

/* Security badge */
.security-row{
  display:flex;align-items:center;justify-content:center;gap:8px;
  color:var(--text-muted);
  font-size:11px;font-weight:500;
}
.security-row svg{width:13px;height:13px;}

/* Version */
.version-tag{
  position:absolute;
  bottom:20px;
  right:24px;
  font-size:10px;
  font-family:'JetBrains Mono',monospace;
  color:rgba(255,255,255,0.18);
  letter-spacing:0.5px;
}

/* Responsive */
@media(max-width:900px){
  .left-panel,.panel-divider{display:none;}
  .right-panel{width:100%;}
}

/* Cursor glow on input */
.login-btn.success-flash{
  background:linear-gradient(90deg,#0f9b73,#00c6a2);
  box-shadow:0 6px 30px rgba(0,198,162,0.45);
}

/* Particle dots */
.particle{
  position:absolute;
  border-radius:50%;
  background:rgba(100,160,255,0.5);
  pointer-events:none;
  animation:particleFade var(--dur) ease-out both;
}
@keyframes particleFade{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-60px) scale(0.3);}}
</style>
</head>

<!-- PANEL DIVIDER -->
<div class="panel-divider"></div>

<!-- RIGHT PANEL -->
<div class="right-panel">
  <div class="login-box">

    <!-- Header -->
    <div class="login-header">
      <div class="logo-circle">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 8H26M10 18H20M10 28V8" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M23 22L29 28" stroke="#4db8ff" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="welcome-title">Bem-vindo ao <span>FluxTrack</span></div>
      <div class="welcome-sub">Faça login para continuar</div>
    </div>

    <!-- Error -->
    <div class="err-box" id="err-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="err-text">Usuário ou senha incorretos.</span>
    </div>

    <!-- Email -->
    <div class="field-group">
      <label class="field-label" for="email-input">Usuário / E-mail</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input type="email" id="email-input" placeholder="Digite seu e-mail" autocomplete="email" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
    </div>

    <!-- Password -->
    <div class="field-group">
      <label class="field-label" for="pass-input">Senha</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="pass-input" placeholder="Digite sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="eye-btn" type="button" onclick="togglePass()" id="eye-btn" aria-label="Mostrar senha">
          <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <!-- Options -->
    <div class="opts-row">
      <label class="remember-wrap">
        <input type="checkbox" id="remember-me" checked>
        <span>Lembrar-me</span>
      </label>
      <a href="#" class="forgot-link" onclick="return false;">Esqueci minha senha?</a>
    </div>

    <!-- Button -->
    <button class="login-btn" id="login-btn" onclick="doLogin()">
      <span class="btn-text">Entrar</span>
      <div class="spinner" id="spinner"></div>
      <span class="btn-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </span>
    </button>

    <div class="divider">acesso seguro</div>

    <!-- Security -->
    <div class="security-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Protegido com criptografia SSL 256-bit
    </div>
  </div>

  <div class="version-tag">v6.0 · FluxTrack</div>
</div>

<script>
function togglePass(){
  var inp=document.getElementById('pass-input');
  var btn=document.getElementById('eye-btn');
  var showing=inp.type==='text';
  inp.type=showing?'password':'text';
  btn.innerHTML=showing
    ?'<svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
    :'<svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
}

function showError(msg){
  var box=document.getElementById('err-box');
  document.getElementById('err-text').textContent=msg;
  box.classList.add('show');
}
function hideError(){document.getElementById('err-box').classList.remove('show');}

function setLoading(on){
  var btn=document.getElementById('login-btn');
  if(on){btn.classList.add('loading');btn.disabled=true;}
  else{btn.classList.remove('loading');btn.disabled=false;}
}

function doLogin(){
  hideError();
  var email=document.getElementById('email-input').value.trim();
  var pass=document.getElementById('pass-input').value;
  if(!email){showError('Por favor, informe seu e-mail.');return;}
  if(!pass){showError('Por favor, informe sua senha.');return;}
  setLoading(true);
  // Simulate async login (replace with real Firebase call)
  setTimeout(function(){
    setLoading(false);
    // Demo: any input shows error after 1.5s
    showError('Usuário ou senha incorretos. Verifique suas credenciais.');
  },1500);
}

// Subtle particles on btn hover
document.getElementById('login-btn').addEventListener('mouseenter',function(e){
  for(var i=0;i<5;i++){spawnParticle(e.currentTarget);}
});
function spawnParticle(el){
  var p=document.createElement('div');
  p.className='particle';
  var rect=el.getBoundingClientRect();
  var x=Math.random()*rect.width;
  p.style.cssText='width:4px;height:4px;left:'+x+'px;bottom:0;position:absolute;--dur:'+(0.8+Math.random()*0.5)+'s;';
  el.appendChild(p);
  setTimeout(function(){p.remove();},(1.3+Math.random()*0.5)*1000);
}
</script>
</body>
